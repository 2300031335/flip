name: Trust Graph Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Pytest & Linting
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: trust_graph
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest flake8 pymysql

      - name: Wait for MySQL
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

          until mysqladmin ping -h 127.0.0.1 -uroot -proot --silent
          do
            echo "Waiting for MySQL..."
            sleep 5
          done

      - name: Lint with flake8
        run: |
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Seed Database
        run: |
          cd backend
          python -c "from db.seed_data import seed_database; seed_database()"

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          pytest -v

  build-and-push-docker:
    name: Build Docker Images
    needs: test-backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t trustgraph/backend:${{ github.sha }} ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t trustgraph/frontend:${{ github.sha }} ./frontend

  k8s-dry-run:
    name: Kubernetes Deployment Validation
    needs: build-and-push-docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      - name: Validate Kubernetes Manifests
        run: |
          kubectl apply --dry-run=client -f k8s/deployment.yaml
          kubectl apply --dry-run=client -f k8s/service.yaml