apiVersion: apps/v1
kind: Deployment
metadata:
  name: trust-graph-backend
  labels:
    app: trust-graph-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: trust-graph-backend
  template:
    metadata:
      labels:
        app: trust-graph-backend
    spec:
      containers:
      - name: backend
        image: trustgraph/backend:v1.0.0
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: trust-graph-config
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trust-graph-frontend
  labels:
    app: trust-graph-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trust-graph-frontend
  template:
    metadata:
      labels:
        app: trust-graph-frontend
    spec:
      containers:
      - name: frontend
        image: trustgraph/frontend:v1.0.0
        ports:
        - containerPort: 3000
